name: Build and publish rules

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - .python-version
      - pyproject.toml
      - uv.lock
      - sources.yaml
      - scripts/**
      - tests/**
      - custom/**
      - LICENSE
  pull_request:
    paths:
      - .github/workflows/build.yml
      - .python-version
      - pyproject.toml
      - uv.lock
      - sources.yaml
      - scripts/**
      - tests/**
      - custom/**
      - LICENSE
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Test
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Generate subscriptions
        run: uv run --locked python scripts/generate.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rules
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publication
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rules
          path: ${{ runner.temp }}/rules-output
      - name: Publish release branch
        working-directory: publication
        env:
          RULES_ARTIFACT_DIR: ${{ runner.temp }}/rules-output
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git switch --create release --track origin/release
          else
            git switch --orphan release
          fi
          rsync --archive --delete --exclude=.git "$RULES_ARTIFACT_DIR/" ./
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Generated subscriptions are unchanged."
            exit 0
          fi
          git commit -m "Update generated rules"
          git push origin HEAD:release
