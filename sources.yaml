sources:
  # proxy
  - name: gfw
    policy: proxy
    behavior: domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/gfw.yaml
  - name: ai-not-cn
    policy: proxy
    behavior: domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/category-ai-!cn.yaml
  - name: telegram
    policy: proxy
    behavior: ipcidr
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geoip/telegram.yaml
  # direct
  - name: cn
    policy: direct
    behavior: domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/cn.yaml
  # custom proxy
  - name: custom-proxy-domains
    policy: proxy
    behavior: domain
    path: custom/domain/proxy.yaml
  - name: custom-proxy-ips
    policy: proxy
    behavior: ipcidr
    path: custom/ipcidr/proxy.yaml
  # custom direct
  - name: custom-direct-domains
    policy: direct
    behavior: domain
    path: custom/domain/direct.yaml
  - name: custom-direct-ips
    policy: direct
    behavior: ipcidr
    path: custom/ipcidr/direct.yaml
